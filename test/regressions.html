<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bezelkit — regression checks</title>
<style>body { font: 14px/1.5 ui-monospace, monospace; padding: 24px; } .pass { color: #2e7d4f; } .fail { color: #b3261e; font-weight: 700; } .box { width: 200px; height: 300px; }</style>
</head>
<body>
<h1>Regression checks</h1>
<ol id="out"></ol>
<div id="sandbox"></div>
<script type="module">
// ?bundle loads dist/bezelkit.js instead of src/, to check the single-file CDN build.
const mod = await import(location.search.includes('bundle') ? '../dist/bezelkit.js' : '../src/bezel.js');
const { defineDevice, resolveFit } = mod;
const out = document.getElementById('out'), box = document.getElementById('sandbox');
const results = [];
const check = (name, ok, info = '') => {
  results.push({ name, ok });
  out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'} · ${name}${info ? ` · ${info}` : ''}</li>`);
};
const tick = (ms = 50) => new Promise((r) => setTimeout(r, ms));
const make = (attrs, html = '') => {
  const el = document.createElement('bezel-device');
  el.className = 'box';
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  el.innerHTML = html;
  box.append(el);
  return el;
};
const png = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h }).toDataURL();

// C2 — colour attribute must not inject markup into the shadow root
window.__xss = 0;
const c2 = make({ device: 'iphone-17-pro', color: 'var(--x,"><img src=x onerror=window.__xss=1>")' });
await tick(300);
check('C2 color attribute cannot inject HTML', window.__xss === 0 && !c2.shadowRoot.querySelector('.frame img'));
const c2b = make({ device: 'iphone-17-pro', color: 'rgb(10 120 200)' });
await tick();
check('C2 plain CSS colours still work', c2b.shadowRoot.querySelector('.frame').innerHTML.includes('rgb(10 120 200)'));

// H1 — javascript: src must not become an iframe
const h1 = make({ device: 'iphone-17-pro', src: 'javascript:window.__xss=2' });
await tick(300);
check('H1 javascript: src is refused', window.__xss === 0 && !h1.shadowRoot.querySelector('iframe'));
const h1b = make({ device: 'iphone-17-pro', src: 'data:text/html,<script>parent.__xss=3<\/script>' });
await tick(300);
check('H1 data:text/html src is refused', window.__xss === 0 && !h1b.shadowRoot.querySelector('iframe'));

// H4 — a device defined after the element rendered should take effect
const h4 = make({ device: 'late-kiosk' });
await tick();
defineDevice({ id: 'late-kiosk', name: 'Kiosk', kind: 'tablet', screen: { w: 600, h: 1000, radius: 0 }, bezel: 30, rim: 4, colors: [['Grey', '#777']] });
await tick();
check('H4 defineDevice() after render re-renders', h4.shadowRoot.querySelector('.screen').style.width === '600px', h4.shadowRoot.querySelector('.screen').style.width);

// H5 — bezel-fit must not fire for unrelated attribute changes (and must not loop)
const h5 = make({ device: 'iphone-17-pro', src: png(402, 874) });
let fits = 0;
h5.addEventListener('bezel-fit', () => { fits++; if (fits < 50) h5.setAttribute('theme', fits % 2 ? 'dark' : 'light'); });
await tick(400);
const afterLoad = fits;
for (const [k, v] of [['theme', 'dark'], ['glare', ''], ['shadow', 'none'], ['chrome', 'on'], ['theme', 'light']]) { h5.setAttribute(k, v); await tick(20); }
await tick(200);
check('H5 bezel-fit fires once per real change', afterLoad === 1 && fits === 1, `events=${fits}`);

// fit logic boundaries
const bx = { w: 402, h: 874 }, r = 402 / 874;
check('resolveFit: same shape → cover', resolveFit('auto', 'image', { w: 402, h: 874 }, bx) === 'cover');
check('resolveFit: 3× taller image → scroll', resolveFit('auto', 'image', { w: 402, h: 874 * 3 }, bx) === 'scroll');
check('resolveFit: 10% taller → top', resolveFit('auto', 'image', { w: 402, h: 874 * 1.1 }, bx) === 'top');
check('resolveFit: wider → contain', resolveFit('auto', 'image', { w: 402, h: 402 / (r * 1.3) }, bx) === 'contain');
check('resolveFit: video never scrolls', resolveFit('scroll', 'video', null, bx) === 'contain');

document.body.dataset.done = JSON.stringify({ passed: results.filter((x) => x.ok).length, failed: results.filter((x) => !x.ok).map((x) => x.name) });
</script>
</body>
</html>
